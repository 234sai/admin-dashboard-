<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HV Vertex Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark-green stage framing a light bento app (sidebar, topbar, 12-column card grid), the look of the reference reel. */
@property --a1{syntax:'<color>';inherits:true;initial-value:#0f4a32}
@property --a2{syntax:'<color>';inherits:true;initial-value:#1f7a50}
@property --a3{syntax:'<color>';inherits:true;initial-value:#62d6a2}
:root{
  --a1:#0f4a32;--a2:#1f7a50;--a3:#62d6a2;
  --bg:#e9efea;--shell:#f6f8f6;--card:#ffffff;--card2:#f1f5f2;
  --ink:#0d1f16;--ink2:#566860;--ink3:#8a9b92;--line:#e1e8e3;--hatch:#c8d3cb;
  --good:#1a8f5a;--warn:#b97a0c;--bad:#d2383a;--info:#2f62c9;
  --sh:0 1px 2px rgba(10,40,25,.05),0 14px 28px -18px rgba(10,40,25,.28);
  --stage:color-mix(in srgb,var(--a1) 62%,#000);--stage2:color-mix(in srgb,var(--a2) 60%,transparent);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  transition:--a1 .6s ease,--a2 .6s ease,--a3 .6s ease;
}
:root[data-accent="emerald"]{--a1:#065f46;--a2:#10b981;--a3:#6ee7b7}
:root[data-accent="blue"]{--a1:#1b3a8f;--a2:#3b6fe0;--a3:#9dbcff}
:root[data-accent="violet"]{--a1:#3a2a86;--a2:#6d54d6;--a3:#c2b5ff}
:root[data-accent="amber"]{--a1:#6b3a07;--a2:#c57a14;--a3:#f6c874}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060b16;--shell:#0b1120;--card:#111a2e;--card2:#16213a;--ink:#e6edf3;--ink2:#9db0c4;--ink3:#65778c;--line:#1e2a41;--hatch:#27364f;
  --good:#34d399;--warn:#f0b43c;--bad:#f27070;--info:#7aa2ff;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 28px -18px rgba(0,0,0,.7);
  --stage:#04070d;--stage2:color-mix(in srgb,var(--a1) 70%,transparent);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060b16;--shell:#0b1120;--card:#111a2e;--card2:#16213a;--ink:#e6edf3;--ink2:#9db0c4;--ink3:#65778c;--line:#1e2a41;--hatch:#27364f;
  --good:#34d399;--warn:#f0b43c;--bad:#f27070;--info:#7aa2ff;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 28px -18px rgba(0,0,0,.7);
  --stage:#04070d;--stage2:color-mix(in srgb,var(--a1) 70%,transparent);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--font);color:var(--ink);min-height:100vh;
  background:radial-gradient(900px 520px at 10% -8%,var(--stage2),transparent 65%),var(--stage);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:15px;font-weight:700;letter-spacing:-.005em}
.sub{color:var(--ink2);margin-top:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:1500px;margin:0 auto;background:var(--shell);border-radius:24px;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 32px);overflow:hidden;position:relative;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.side{padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);position:relative}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;padding:0 8px 16px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--a1);color:#fff;display:grid;place-items:center;transition:background-color .1s}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 4px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;text-align:left;transition:background-color .2s,color .2s}
.nav button:hover{background:var(--card2);color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--card2)}
.nav button .badge{margin-left:auto;background:var(--a1);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav-ind{position:absolute;left:-16px;top:0;width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--a2);transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.promo{margin-top:auto;border-radius:18px;padding:16px;color:#fff;background:radial-gradient(140px 90px at 90% 0%,color-mix(in srgb,var(--a3) 38%,transparent),transparent 70%),var(--a1);display:flex;flex-direction:column;gap:6px}
.promo b{font-size:14px;line-height:1.25}.promo span{font-size:12px;opacity:.75}
.promo .btn{margin-top:8px;background:var(--a2);color:#fff;justify-content:center}

.main #view,#view{display:flex;flex-direction:column;gap:20px}
.main{padding:20px 26px 30px;min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;height:44px;box-shadow:var(--sh);color:var(--ink3);max-width:460px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%}
.search kbd{font:600 11px var(--mono);background:var(--card2);padding:2px 7px;border-radius:6px;color:var(--ink2)}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh);gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink2);transition:background-color .25s,color .25s}
.seg button.on{background:var(--a1);color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 14px;height:44px;box-shadow:var(--sh);font-size:13px;font-weight:600;color:var(--ink2)}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;position:relative;color:var(--ink2);transition:transform .2s}
.ibtn:hover{transform:translateY(-2px);color:var(--ink)}
.ibtn .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.ava{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--a3) 45%,var(--card));color:var(--a1);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .ava,:root[data-theme="dark"] .logo{color:#fff}
.me{display:flex;align-items:center;gap:10px}.me b{display:block;font-size:13px;line-height:1.2}.me span{font-size:11.5px;color:var(--ink3)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;transition:transform .2s,filter .2s,background-color .3s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--a1);color:#fff}.btn.out{box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card)}
.btn.red{background:var(--bad);color:#fff}.btn.sm{padding:6px 12px;font-size:12px}
.btn.ghost{color:var(--ink2);padding:6px 10px}

.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;min-width:0;position:relative}
.card:hover{transform:translateY(-3px)}
.card .ct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hero{background:radial-gradient(220px 140px at 100% 0%,color-mix(in srgb,var(--a3) 30%,transparent),transparent 70%),var(--a1);color:#fff}
.stat .lab{font-weight:600;color:var(--ink2);font-size:13px}.hero .lab{color:rgba(255,255,255,.78)}
.stat .big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:14px 0 10px;font-variant-numeric:tabular-nums}
.stat .go{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink2)}
.hero .go{background:rgba(255,255,255,.92);color:var(--a1);box-shadow:none}
.mini{height:5px;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);overflow:hidden}
.mini i{display:block;height:100%;border-radius:5px;background:var(--a2);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .3s}
.hero .mini i{background:var(--a3)}
.note{font-size:12px;color:var(--ink3);margin-top:8px}.hero .note{color:rgba(255,255,255,.65)}

.rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

.bars{display:flex;align-items:flex-end;gap:12px;height:198px;padding-top:34px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.bar .pl{width:100%;max-width:58px;border-radius:999px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*70ms + .25s);background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 6px),var(--card2);transition:background .35s,transform .3s;cursor:pointer}
.bar .pl.on1{background:var(--a2)}.bar .pl.on2{background:var(--a3)}.bar .pl.on3{background:var(--a1)}
.bar:hover .pl{background:var(--a2);transform:scaleY(1.04)}
.bar small{font-size:11.5px;color:var(--ink3);font-weight:600}
.bar::after{content:attr(data-tip);position:absolute;top:var(--tip);z-index:2;background:var(--ink);color:var(--card);font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(6px);pointer-events:none;transition:.2s}
.bar:hover::after{opacity:1;transform:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.rem h3{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.rem .btn{width:100%;justify-content:center;margin-top:18px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--ink3);font-size:12px}
.fi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--a2);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.mute{background:var(--card2);color:var(--ink2)}

.gauge{position:relative;display:grid;place-items:center;margin-top:6px}
.gauge svg{width:100%;max-width:230px;overflow:visible}
.gauge .gv{position:absolute;bottom:14px;text-align:center}
.gauge .gv b{font-size:34px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}
.gauge .gv span{font-size:12px;color:var(--ink3)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

.timer{background:var(--a1);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:210px;position:relative;isolation:isolate}
.timer::before{content:"";position:absolute;inset:-40%;z-index:-1;background:repeating-radial-gradient(ellipse at 115% -25%,transparent 0 13px,rgba(255,255,255,.08) 13px 14.5px);animation:drift 14s linear infinite}
@keyframes drift{to{transform:rotate(6deg) scale(1.08)}}
.timer h2{color:#fff;font-weight:600;font-size:16px}
.timer .digits{font:600 40px/1 var(--mono);letter-spacing:-.02em;text-align:center;margin:10px 0;display:flex;justify-content:center;overflow:hidden;font-variant-numeric:tabular-nums}
.digits span{display:inline-block}
.digits span.roll{animation:roll .45s cubic-bezier(.2,.9,.2,1)}
@keyframes roll{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.timer .tb{display:flex;gap:12px;justify-content:center}
.rb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.rb:hover{transform:scale(1.08)}.rb:active{transform:scale(.92)}
.rb.w{background:#f4f8f5;color:var(--a1)}.rb.r{background:#e0383a;color:#fff}
.tsub{text-align:center;font-size:12px;opacity:.75;margin-top:8px}
.app[data-portal="closed"] .timer .digits{color:#ffb4b4}

.app[data-portal="closed"] .not-closed{display:none!important}
.app[data-portal="open"] .only-closed,.app[data-portal="open"] .only-late,.app[data-portal="closed"] .only-open,.app[data-portal="closed"] .only-late,.app[data-portal="late"] .only-open,.app[data-portal="late"] .only-closed{display:none!important}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;font-weight:600}
.banner.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card));color:var(--bad);animation:pop .5s cubic-bezier(.3,1.4,.4,1)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn)}
.banner.good{background:color-mix(in srgb,var(--good) 12%,var(--card));color:var(--good)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

.dz{border:2px dashed color-mix(in srgb,var(--a2) 55%,transparent);border-radius:20px;padding:34px 20px;text-align:center;background:color-mix(in srgb,var(--a3) 9%,var(--card));transition:background-color .25s,border-color .25s,transform .25s;cursor:pointer;display:block;width:100%;position:relative;overflow:hidden}
.dz:hover,.dz.drag{background:color-mix(in srgb,var(--a3) 22%,var(--card));transform:scale(1.01)}
.dz .up{width:54px;height:54px;border-radius:50%;background:var(--a1);color:#fff;display:grid;place-items:center;margin:0 auto 12px;animation:float 3s ease-in-out infinite}
.dz .up .ic{width:24px;height:24px}
@keyframes float{50%{transform:translateY(-6px)}}
.dz b{display:block;font-size:16px}.dz span{color:var(--ink2);font-size:13px}
.app[data-portal="closed"] .dz{border-color:var(--bad);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 8%,var(--card)) 0 10px,var(--card) 10px 20px);cursor:not-allowed}
.app[data-portal="closed"] .dz .up{background:var(--bad);animation:none}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.prog{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--a2);transition:width .25s linear}
.rcpt{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin-top:8px;color:var(--ink2)}
.rcpt dt{color:var(--ink3)}.rcpt dd{margin:0;font-family:var(--mono);word-break:break-all}

.mask{filter:blur(5px);user-select:none;transition:filter .8s}
.unlocked .mask{filter:none}
.ring{width:64px;height:64px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 13px var(--mono)}

.chatwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
.chan{display:flex;flex-direction:column;gap:2px}
.chan button{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-weight:600;color:var(--ink2);text-align:left}
.chan button.on,.chan button:hover{background:var(--card2);color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:14px;min-height:340px;max-height:460px;overflow-y:auto;padding:4px 4px 8px}
.m{display:flex;gap:10px;max-width:86%;animation:pop .35s cubic-bezier(.3,1.3,.4,1) both}
.m.me2{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--card2);padding:10px 14px;border-radius:16px 16px 16px 4px;min-width:0}
.m.me2 .bub{background:var(--a1);color:#fff;border-radius:16px 16px 4px 16px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:4px}
.bub b{font-size:12.5px;display:block}
pre.code{margin:8px 0 0;background:#0b1120;color:#d6e2f0;border-radius:10px;padding:10px 12px;font:12px/1.55 var(--mono);overflow-x:auto}
.code .k{color:#7dd3fc}.code .f{color:#6ee7b7}.code .n{color:#fbbf77}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px);background:var(--a2)}}
.compose{display:flex;gap:10px;margin-top:12px}
.compose input,.field{flex:1;min-width:0;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;outline:0;transition:border-color .2s}
.compose input:focus,.field:focus{border-color:var(--a2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);transition:.2s}
.chips button:hover{background:var(--a1);color:#fff;box-shadow:none}

.al{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:var(--sh);transition:transform .25s,opacity .3s}
.al .tier{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.al.t-red .tier{background:var(--bad)}.al.t-blue .tier{background:var(--info)}.al.t-green .tier{background:var(--good)}
.al.read{opacity:.55}.al.unread.t-red{box-shadow:inset 3px 0 0 var(--bad),var(--sh)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 12px;font-weight:700}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background-color .2s}tbody tr:hover{background:var(--card2)}
.tw{overflow-x:auto}

.scrim{position:fixed;inset:0;background:rgba(5,15,10,.45);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:30;animation:fade .25s both;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:22px;padding:24px;width:min(440px,100%);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:zoom .35s cubic-bezier(.3,1.25,.4,1) both;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 60px);overflow:auto}

.panel.open{transform:none}
.pop{position:fixed;right:max(30px,env(safe-area-inset-right,0px));top:92px;z-index:25;background:var(--card);border-radius:18px;padding:16px;width:260px;box-shadow:0 24px 60px -18px rgba(0,0,0,.45);transform-origin:top right;animation:zoom .25s both;display:flex;flex-direction:column;gap:10px}
.sw{display:flex;gap:10px}
.sw button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card),0 0 0 2px transparent;transition:transform .2s,box-shadow .2s}
.sw button:hover{transform:scale(1.12)}.sw button.on{box-shadow:inset 0 0 0 3px var(--card),0 0 0 2px var(--ink)}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;font-weight:600;font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);animation:toastin .4s cubic-bezier(.3,1.3,.4,1) both;display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}.toast.out{animation:toastout .3s both}
@keyframes toastin{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateY(10px)}}
.kill{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bad) 88%,#000);color:#fff;display:grid;place-items:center;text-align:center;animation:fade .3s both;padding:16px}
.kill .ic{width:56px;height:56px;margin-bottom:10px;animation:pop .6s both}
.kill b{font-size:26px;display:block}

.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border:0}.kv span{color:var(--ink3)}.kv b{font-weight:600;text-align:right}

@media (max-width:1180px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}

  .brand{padding:0 8px 0 0}.grp,.promo,.nav-ind{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 12px;white-space:nowrap}

function bars(vals,labels,tips,hl){

  return '<div class="bars">'+vals.map((v,i)=>{const h=Math.max(18,Math.round(v/mx*100));const cls=hl[i]?' on'+hl[i]:'';

}

}

  $$('[data-rel]').forEach(e=>e.textContent=dhm(S.releaseAt-n));
  const p=portal();
  if(p!==S.p){const prev=S.p;S.p=p;app.dataset.portal=p;
    if(prev){if(p==='closed')toast('Upload portal closed. Server returns HTTP 423.','bad');else if(p==='late')toast('Deadline passed. Soft lockout: late files are flagged.');else toast('Upload portal is open again.');
      if(S.page==='adash')go('adash')}}

function bindUpload(){
  const dz=$('#dz'),f=$('#file');if(!dz)return;
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('drag')}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('drag')}));
  dz.addEventListener('drop',ev=>handleFiles(ev.dataTransfer.files));
  f.addEventListener('change',()=>{handleFiles(f.files);f.value=''});
}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function sha(file){
  try{const b=await file.arrayBuffer();const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return rid(64)}
}
function handleFiles(files){
  const p=portal();
  if(p==='closed'){const dz=$('#dz');dz.classList.remove('shake');void dz.offsetWidth;dz.classList.add('shake');toast('423 Locked. The deadline has passed on the server.','bad');return}
  [...files].forEach(async file=>{
    const u={name:file.name,size:kb(file.size),p:0,done:false};S.uploaded.unshift(u);renderUList();
    const h=await sha(file);
    const iv=setInterval(()=>{u.p=Math.min(100,u.p+8+Math.random()*14);if(u.p>=100){clearInterval(iv);
      const t=now(),late=portal()!=='open';
      u.done=true;u.hash=h;u.ts=fmtT(t)+'.'+String(t%1000).padStart(3,'0');u.id='A-'+(++S.seq);u.late=late;
      S.count++;S.subs.unshift({n:'K. Hitesh Laahiri',ts:u.ts,h:h.slice(0,8)+'…'+h.slice(-4),st:late?'Late +'+Math.max(1,Math.round((t-S.deadline)/60000))+' m':'On time',g:''});
      toast('Upload received. Receipt '+u.id);}
      if(S.page==='uploads')renderUList()},180);
  });
}

  if(/late|policy|penalt/.test(s))return 'Hard lockout is the default: uploads stop at the deadline. Projects set to soft lockout accept late files and flag them with a penalty.';
  if(/download|vault|link|unlock/.test(s))return 'Confidential files unlock inside a release window. Each download link works for 300 seconds, then returns HTTP 410.';
  return 'I can answer questions about your deadlines, downloads and company policy. For anything else, ask an admin.';
}

  else{S.chat.push({me:1,t:fmtT(now()).slice(0,5),txt:v,seen:'Sent'});refreshChat();
    setTimeout(()=>{const l=S.chat.filter(c=>c.me).pop();if(l)l.seen='Seen '+fmtT(now()).slice(0,5);if(S.page==='chat'&&S.tab==='team')refreshChat()},1600)}
}

  ff:()=>{S.deadline=now()+6000;toast('Deadline set to 6 seconds from server time.');tick()},
  resetdl:()=>{S.deadline=now()+((2*60+22)*60+37)*1000;tick();toast('Deadline reset to 2 h 22 m.');if(S.page==='adash')go('adash')},
  pass:()=>openModal('<h3>Issue extension pass</h3><p class="sub">One employee may upload after the deadline. The pass is logged.</p><label for="pe">Employee</label><select id="pe"><option value="me">K. Hitesh Laahiri</option><option>Ravi Kumar</option><option>Meera Shah</option><option>Arun Prasad</option></select><label for="pm">Extra time</label><select id="pm"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="60">1 hour</option></select><div class="mfoot"><button class="btn out" data-action="closeModal">Cancel</button><button class="btn pri" data-action="passGo">Issue pass</button></div>'),
  passGo:()=>{const w=$('#pe').value,m=+$('#pm').value;closeModal();
    if(w==='me'){S.deadline=now()+m*60000;S.alerts.unshift({id:Date.now(),tier:'green',title:'Extension pass granted',body:'You may upload for '+m+' more minutes.',time:fmtT(now()).slice(0,5),read:false});toast('Pass issued. Portal reopened for '+m+' minutes.');tick();renderNav()}
    else toast('Pass issued to '+w+' for '+m+' minutes.')},
  closeModal:()=>closeModal(),
  scrim:(t,e)=>{if(e.target===t)closeModal()},
  pickfile:()=>{if(portal()==='closed'){handleFiles([]);return}$('#file').click()},
  release:()=>{S.released=!S.released;go('vault');toast(S.released?'Release window opened. motor_ctrl_codebase.zip is now available.':'Release window reset.')},
  locked:()=>toast('423 Locked. This file is not released yet.','bad'),
  dl:t=>{const names=['Alpha_schematic_v3.pdf','motor_ctrl_codebase.zip'];const nm=names[+t.dataset.v];A.mkLink(nm)},
  mkLink:nm=>{S.lastName=nm;S.link=now()+300000;
    openModal('<h3>Download ready</h3><p class="sub">'+esc(nm)+'</p><div id="lbody"><div style="display:flex;gap:16px;align-items:center"><div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--card2)" stroke-width="6"/><circle id="lring" cx="32" cy="32" r="26" fill="none" stroke="var(--a2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/></svg><b id="ltxt">300s</b></div><div class="link" id="lurl">https://files.hvvertex.example/s/'+rid(14)+'?exp='+Math.floor(S.link/1000)+'&amp;sig='+rid(20)+'</div></div></div><div class="mfoot" id="lfoot"><button class="btn ghost" data-action="expire">Simulate expiry</button><button class="btn out" data-action="copylink">Copy link</button><button class="btn pri" data-action="closeModal">Done</button></div>')},
  newlink:()=>A.mkLink(S.lastName),
  expire:()=>{S.link=now()+300;},
  copylink:async()=>{const t=$('#lurl').textContent;try{await navigator.clipboard.writeText(t);toast('Link copied')}catch(e){const r=document.createRange();r.selectNodeContents($('#lurl'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Select and copy the link')}},
  read:t=>{const a=S.alerts.find(x=>x.id==t.dataset.v);a.read=true;toast(a.ack?'Acknowledged. Your admin can see this.':'Marked read');go('alerts')},
  readall:()=>{S.alerts.forEach(a=>{if(!a.ack)a.read=true});go('alerts')},
  tab:t=>{S.tab=t.dataset.v;go('chat')},
  chan:t=>{S.tab='team';S.chan=+t.dataset.v;go('chat')},
  chip:t=>send(t.dataset.v),
  escalate:()=>toast('Escalated to an admin. Your chat history is attached.'),
  filter:t=>{S.filter=t.dataset.v;go('subs')},
  rowopen:t=>{const r=S.subs[+t.dataset.v];
    openPanel('<div style="display:flex;justify-content:space-between;align-items:center"><h2>Submission</h2><button class="ibtn" style="width:36px;height:36px;box-shadow:none;background:var(--card2)" data-action="closePanel" aria-label="Close">'+ic('x')+'</button></div><div style="display:flex;gap:12px;align-items:center"><div class="ava" style="width:48px;height:48px;font-size:15px">'+r.n.split(" ").map(w=>w[0]).join("").slice(0,2)+'</div><div><b>'+r.n+'</b><div class="sub" style="margin:0">Alpha firmware</div></div></div><div class="kv"><span>Server time</span><b class="mono">'+r.ts+'</b></div><div class="kv"><span>SHA-256</span><b class="mono">'+r.h+'</b></div><div class="kv"><span>Status</span><b>'+r.st+'</b></div><label for="gr" style="font-weight:700;font-size:12px;color:var(--ink2)">Grade</label><select class="field" id="gr" style="flex:none"><option>A</option><option>B</option><option>C</option><option>Needs rework</option></select><button class="btn pri" data-action="savegrade" data-v="'+t.dataset.v+'" style="justify-content:center">Save grade</button>')},
  closePanel:()=>closePanel(),
  savegrade:t=>{const r=S.subs[+t.dataset.v];r.g=$('#gr').value.slice(0,1);closePanel();toast('Grade saved for '+r.n);if(S.page==='subs')go('subs')},
  remind:t=>{S.defs[+t.dataset.v].st=1;$('#deflist').innerHTML=defHtml();toast('Reminder sent to '+S.defs[+t.dataset.v].n)},
  penalty:t=>{S.defs[+t.dataset.v].st=2;$('#deflist').innerHTML=defHtml();toast('Penalty tagged for '+S.defs[+t.dataset.v].n)},
  simaccess:()=>{
    toast('403 Forbidden. /admin/deadlines','bad');
    const l=$('#layer');l.innerHTML='<div class="kill" role="alert"><div>'+ic('shield')+'<b>Session terminated</b><p style="opacity:.85;margin-top:6px">An employee token requested an admin route. The server refused it, signed the user out and logged the attempt.</p></div></div>';
    setTimeout(()=>{closeModal();S.incidents.unshift({t:'Today '+fmtT(now()).slice(0,5),who:'Test account (Employee)',what:'GET /admin/deadlines',res:'403, session revoked'});S.alertsSec++;go('sec');toast('Incident recorded in the security log')},2600)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const f=A[t.dataset.action];if(f)f(t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePanel();$('#popwrap').innerHTML=''}});
$('#q').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=e.target.value.toLowerCase();const m={upload:'uploads',vault:'vault',download:'vault',chat:'chat',alert:'alerts',submission:'subs',security:'sec'};
  const k=Object.keys(m).find(x=>v.includes(x));if(k){if(S.role==='adm'&&['subs','sec'].includes(m[k])||S.role==='emp'&&!['subs','sec'].includes(m[k])){go(m[k]);e.target.value=''}else toast('That page belongs to the other view')}else toast('No match. Try uploads, vault, chat or alerts.')});
function popRender(){
  const ac=document.documentElement.dataset.accent||'forest',th=load('hv-theme')||'system';
  const col={forest:'#1f7a50',emerald:'#10b981',blue:'#3b6fe0',violet:'#6d54d6',amber:'#c57a14'};
  $('#popwrap').innerHTML='<div class="pop" role="dialog" aria-label="Appearance"><h2>One accent re-tints everything</h2><div class="sw">'+Object.keys(col).map(k=>'<button data-action="accent" data-v="'+k+'" class="'+(k===ac?'on':'')+'" style="background:'+col[k]+'" aria-label="'+k+'"></button>').join('')+'</div><div class="seg" style="box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card2)">'+['light','dark','system'].map(k=>'<button data-action="theme" data-v="'+k+'" class="'+(k===th?'on':'')+'" style="text-transform:capitalize">'+k+'</button>').join('')+'</div></div>';
}
(function boot(){
  const a=load('hv-accent'),t=load('hv-theme');
  if(a)document.documentElement.dataset.accent=a;
  if(t&&t!=='system')document.documentElement.dataset.theme=t;
  S.p=portal();app.dataset.portal=S.p;
  go('dash');
})();
</script>

</body></html>
